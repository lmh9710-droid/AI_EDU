[package]
name = "sf-interlock-hub"
version = "1.0.0"
edition = "2021"
rust-version = "1.80"
description = "Smart factory safety interlock hub: owns the conveyor (EQ 4) serial port"

[dependencies]
serialport = { version = "4.3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
ctrlc = "3.4"

[profile.release]
opt-level = 3
lto = true
