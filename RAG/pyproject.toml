[project]
name = "smartfactory-rag-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "langchain>=1.4.9",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.20",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "ollama>=0.6.3",
    "pandas>=3.1.1",
    "pymupdf>=2.1",
    "python-dotenv>=1.2.4",
    "streamlit>=1.66.1",
]

[project.scripts]
smartfactory-rag-agent = "smartfactory_rag_agent:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = false
